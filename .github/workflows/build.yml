name: Maven build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify source and tests
        shell: bash
        run: |
          set +e
          mvn -B clean verify > maven.log 2>&1
          result=$?
          cat maven.log
          if [ "$result" -ne 0 ]; then
            {
              echo '## Maven failure tail'
              echo '```text'
              tail -n 50 maven.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              message=${line//'%'/'%25'}
              message=${message//$'\r'/'%0D'}
              message=${message//$'\n'/'%0A'}
              message=${message:0:900}
              printf '::error title=Maven diagnostic::%s\n' "$message"
            done < <(tail -n 20 maven.log)
          fi
          exit "$result"
      - name: Explain failing tests
        if: failure()
        shell: python
        run: |
          import glob
          import xml.etree.ElementTree as ET
          found = False
          for report in glob.glob('target/surefire-reports/TEST-*.xml'):
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  for issue in case:
                      if issue.tag not in {'failure', 'error'}:
                          continue
                      found = True
                      detail = issue.get('message', '') or (issue.text or '').splitlines()[0:1]
                      if isinstance(detail, list):
                          detail = detail[0] if detail else 'No error detail recorded'
                      message = f"{case.get('classname')}.{case.get('name')}: {issue.tag}: {detail}"
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title=JUnit test failure::{message[:900]}")
          if not found:
              print('::warning title=JUnit diagnostics::No Surefire testcase errors were found in the XML reports.')
      - name: Package and inspect release artifacts
        run: python3 scripts/package_release.py
      - name: Upload verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: AstraCurrencyEngine-1.21.11-26.2
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
