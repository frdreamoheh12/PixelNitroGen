name: Maven build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify source and tests
        shell: bash
        run: |
          set +e
          mvn -B clean verify > maven.log 2>&1
          result=$?
          cat maven.log
          if [ "$result" -ne 0 ]; then
            {
              echo '## Maven failure tail'
              echo '```text'
              tail -n 50 maven.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              message=${line//'%'/'%25'}
              message=${message//$'\r'/'%0D'}
              message=${message//$'\n'/'%0A'}
              message=${message:0:900}
              printf '::error title=Maven diagnostic::%s\n' "$message"
            done < <(tail -n 20 maven.log)
          fi
          exit "$result"
      - name: Package and inspect release artifacts
        run: python3 scripts/package_release.py
      - name: Upload verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: AstraCurrencyEngine-1.21.11-26.2
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
