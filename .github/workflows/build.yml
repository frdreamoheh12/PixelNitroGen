name: Maven build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify source and tests
        run: mvn -B clean verify
      - name: Package and inspect release artifacts
        run: python3 scripts/package_release.py
      - name: Upload verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: AstraCurrencyEngine-1.21.11-26.2
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
