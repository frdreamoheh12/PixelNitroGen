prefix: '<gradient:#FFD166:#FF7A18><bold>Astra</bold></gradient> <dark_gray>»</dark_gray> '
no-permission: '<red>You do not have permission to do that.</red>'
player-only: '<red>This command can only be used by a player.</red>'
usage: '<yellow>Usage: <white>{usage}</white></yellow>'
help-header: '<gold><bold>AstraCurrencyEngine</bold> <dark_gray>—</dark_gray> <gray>Commands</gray></gold>'
help-player:
  - '<gray>/currency <white>list</white> <dark_gray>—</dark_gray> List available currencies</gray>'
  - '<gray>/currency balance [currency] [player] <dark_gray>—</dark_gray> View a balance</gray>'
  - '<gray>/currency pay <player> <currency> <amount> <dark_gray>—</dark_gray> Send funds</gray>'
  - '<gray>/currency top <currency> [page] <dark_gray>—</dark_gray> View the leaderboard</gray>'
  - '<gray>/currency history <currency> [page] <dark_gray>—</dark_gray> View your history</gray>'
  - '<gray>/currency info <currency> <dark_gray>—</dark_gray> Currency details</gray>'
  - '<gray>/currency gui <dark_gray>—</dark_gray> Open the dashboard</gray>'
help-admin:
  - '<gray>/ace admin create <id> [name] <dark_gray>—</dark_gray> Create a currency</gray>'
  - '<gray>/ace admin delete <id> confirm <dark_gray>—</dark_gray> Delete currency and live balances</gray>'
  - '<gray>/ace admin edit <id> <property> <value> <dark_gray>—</dark_gray> Edit currency settings</gray>'
  - '<gray>/ace admin give|take|set <player> <currency> <amount> [reason]</gray>'
  - '<gray>/ace admin reset <player> <currency> [confirm]</gray>'
  - '<gray>/ace admin resetall <currency> confirm <dark_gray>—</dark_gray> Reset all balances</gray>'
  - '<gray>/ace admin list|info|reload|backup|restore|migrate|debug|status</gray>'
unknown-currency: '<red>Unknown or disabled currency <white>{currency}</white>.</red>'
invalid-amount: '<red>That amount is invalid. Use up to <white>{decimals}</white> decimal places.</red>'
invalid-player: '<red>Could not resolve player <white>{player}</white>.</red>'
self-payment: '<red>You cannot pay yourself.</red>'
amount-must-be-positive: '<red>The amount must be greater than zero.</red>'
insufficient-funds: '<red>Insufficient {currency_name}. Your balance is <white>{balance}</white>.</red>'
balance-limit: '<red>This transaction would exceed the allowed balance limit.</red>'
transaction-error: '<red>The transaction could not be completed. Check the server log.</red>'
transaction-duplicate: '<red>This request was already processed.</red>'
balance-self: '<gray>Your {currency_name} balance: <white>{balance}</white></gray>'
balance-other: '<gray>{player} has <white>{balance}</white> {currency_name}.</gray>'
payment-sent: '<green>Sent <white>{amount}</white> {currency_name} to <white>{player}</white>. Fee: <white>{tax}</white>. New balance: <white>{balance}</white>.</green>'
payment-received: '<green>You received <white>{amount}</white> {currency_name} from <white>{player}</white>.</green>'
admin-transaction: '<green>{action} <white>{amount}</white> {currency_name} for <white>{player}</white>. New balance: <white>{balance}</white>.</green>'
currency-list-header: '<gold>Available currencies:</gold>'
currency-list-entry: '<gray>• {currency_name} <dark_gray>({id})</dark_gray> <white>{symbol}</white></gray>'
currency-info: '<gold>{currency_name} <dark_gray>({id})</dark_gray></gold> <gray>Precision: <white>{decimals}</white> | Balance: <white>{balance}</white></gray>'
leaderboard-header: '<gold>{currency_name} leaderboard <dark_gray>—</dark_gray> page {page}</gold>'
leaderboard-entry: '<gray>#{rank} <white>{player}</white> <dark_gray>»</dark_gray> <white>{balance}</white></gray>'
leaderboard-empty: '<gray>No balances to show yet.</gray>'
history-header: '<gold>{currency_name} history <dark_gray>—</dark_gray> page {page}</gold>'
history-entry: '<gray>#{id} {type} <white>{amount}</white> <dark_gray>{details}</dark_gray></gray>'
history-empty: '<gray>No transactions found.</gray>'
admin-created: '<green>Created currency <white>{currency}</white>.</green>'
admin-deleted: '<green>Deleted currency <white>{currency}</white> and its live balances. History has been retained.</green>'
admin-edited: '<green>Updated <white>{property}</white> for <white>{currency}</white>.</green>'
admin-reloaded: '<green>Configuration and currencies reloaded.</green>'
admin-confirm: '<red>Repeat with the <white>confirm</white> argument to proceed.</red>'
admin-backup: '<green>Database backup created: <white>{backup}</white>.</green>'
admin-restore: '<green>Database restored from <white>{backup}</white>.</green>'
admin-status: '<gray>AstraCurrencyEngine <white>{version}</white> | Paper <white>{server}</white> | currencies <white>{count}</white> | storage <white>SQLite</white></gray>'
admin-debug: '<gray>DB queue: <white>{queue}</white> | cache entries: <white>{cache}</white> | DB file: <white>{file}</white></gray>'
admin-no-change: '<yellow>No balance change was needed.</yellow>'
admin-help: '<gray>Use <white>/ace admin help</white> for administrator commands.</gray>'
